<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airplane Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 600px;
        }
        h1 {
            color: #333;
        }
        input[type="file"] {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        #result-container {
            margin-top: 20px;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 4px;
            min-height: 50px;
        }
        #result-image {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Detect an Airplane Engine in an Image</h1>
        <form id="uploadForm">
            <input type="file" id="imageFile" name="image" accept="image/*" required>
            <br>
            <button type="submit">Upload & Detect</button>
        </form>
        
        <div id="result-container">
            <div class="loader" id="loader"></div>
            <img id="result-image" src="" alt="Processed Image" style="display:none;">
            <p id="message">Please upload an image to start detection.</p>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const form = event.target;
            const formData = new FormData(form);
            const messageElement = document.getElementById('message');
            const resultImageElement = document.getElementById('result-image');
            const loaderElement = document.getElementById('loader');

            // Hide old results and show loader
            messageElement.style.display = 'none';
            resultImageElement.style.display = 'none';
            loaderElement.style.display = 'block';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData,
                });

                const result = await response.json();

                loaderElement.style.display = 'none'; // Hide loader

                if (response.ok && result.status === 'success') {
                    // Update the image source and show it
                    resultImageElement.src = result.processed_image_url;
                    resultImageElement.style.display = 'block';
                    messageElement.innerText = `Detected ${result.total_detections} engine(s)!`;
                    messageElement.style.display = 'block';
                } else {
                    // Handle server errors
                    messageElement.innerText = `Error: ${result.message || 'Something went wrong on the server.'}`;
                    messageElement.style.display = 'block';
                }
            } catch (error) {
                // Handle network errors
                loaderElement.style.display = 'none';
                messageElement.innerText = 'A network error occurred. Please check your connection and try again.';
                messageElement.style.display = 'block';
            }
        });
    </script>
</body>
</html>
